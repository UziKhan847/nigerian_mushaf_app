name: nigerian_mushaf_app
description: "A new Flutter project."

publish_to: 'none' 

version: 0.0.1+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  
  cupertino_icons: ^1.0.8
  flutter_html: ^3.0.0
  flutter_riverpod: ^2.6.1
  json_annotation: ^4.9.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  json_serializable: ^6.11.1
  build_runner: ^2.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/pages/
    - assets/
  
  fonts:
    - family: Nigerian
      fonts:
        - asset: fonts/N8_5.ttf
  
  
