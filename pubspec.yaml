name: nigerian_mushaf_app
description: "Nigerian Mushaf App — Quranic Mushaf reader with PNG page images."

publish_to: 'none' 

version: 0.0.1+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  cupertino_icons: ^1.0.8
  flutter_html: ^3.0.0
  flutter_riverpod: ^3.3.1
  json_annotation: ^4.9.0
  shared_preferences: ^2.5.3
  intl: ^0.20.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  json_serializable: ^6.11.1
  build_runner: ^2.8.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/pages/
    - assets/
    - assets/pngs/  
    - assets/shaders/

  fonts:
    - family: Nigerian
      fonts:
        - asset: fonts/N8_5.ttf
  
  
